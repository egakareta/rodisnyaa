[tools]
"github:oxc-project/oxc" = { version = "latest", matching = "oxfmt" }
lefthook = "latest"
rust = { version = "nightly-2026-03-12", components = [
    "clippy",
    "rustfmt",
    "rust-src",
] }


[hooks]
postinstall = ["lefthook install"]

[tasks.check]
run = "mise lint && mise format:cargo --check && mise format:oxfmt --check"

[tasks.format]
depends = ["format:cargo", "format:oxfmt"]

[tasks."format:cargo"]
run = "cargo fmt --all"

[tasks."format:oxfmt"]
run = "oxfmt"

[tasks.lint]
run = "cargo clippy --all-targets --all-features --workspace -- -D warnings"

[tasks.test]
depends = ["test:native", "test:wasm", "test:examples:app"]

[tasks."test:native"]
run = "cargo test -- --nocapture"

[tasks."test:wasm"]
run = "WASM_BINDGEN_TEST_NO_CAPTURE=1 wasm-pack test --headless --chrome ."

[tasks."test:examples:app"]
run = "cargo test --manifest-path examples/app/Cargo.toml -- --nocapture"
