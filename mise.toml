[tools]
lefthook = "latest"
oxfmt = "latest"
rust = { version = "nightly-2026-03-12", components = [
    "clippy",
    "rustfmt",
    "rust-src",
] }

[hooks]
postinstall = ["lefthook install"]

[tasks.check]
run = "mise lint && mise format:cargo --check && mise format:oxfmt --check"

[tasks.format]
depends = ["format:cargo", "format:oxfmt"]

[tasks."format:cargo"]
run = "cargo fmt --all"

[tasks."format:oxfmt"]
run = "oxfmt"

[tasks.lint]
run = "cargo clippy --all-targets --all-features --workspace -- -D warnings"

[tasks.test]
depends = ["test:native", "test:wasm", "test:examples:app"]

[tasks."test:native"]
run = "cargo test -- --nocapture"

[tasks."test:wasm"]
run = "wasm-pack test --headless --chrome . -- --nocapture"

[tasks."test:examples:app"]
depends = ["test:examples:app:native", "test:examples:app:wasm"]

[tasks."test:examples:app:native"]
run = "cargo test --manifest-path examples/app/Cargo.toml -- --nocapture"

[tasks."test:examples:app:wasm"]
run = "wasm-pack test --headless --chrome examples/app -- --nocapture"

[tasks."bench:native"]
run = "cargo bench --bench controls"

[tasks."bench:wasm"]
run = "wasm-pack test --release --headless --chrome . --test browser_benches -- --bench --nocapture"

[tasks."serve:examples:app"]
dir = "{{config_root}}/examples/app"
run = "trunk serve"

[bootstrap.packages]
"apt:pkg-config" = "latest"
"apt:libjack-jackd2-dev" = "latest"
