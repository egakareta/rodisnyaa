[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
euphorium = { path = "../.." }
eframe = "0.36"
log = "0.4"
web-time = "1"

[features]
default = ["nightly", "jack"]
asio = ["euphorium/asio"]
nightly = ["euphorium/nightly"]
jack = ["euphorium/jack"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }
