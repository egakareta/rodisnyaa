[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
rodisnyaa = { path = "../.." }
eframe = "0.36"
log = "0.4"
web-time = "1"

[features]
default = ["wav"]
asio = ["rodisnyaa/asio"]
jack = ["rodisnyaa/jack"]
wav = ["rodisnyaa/wav"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Blob",
    "Url",
    "console",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
